[project]
name = "openadr-gui"
version = "0.0.20"
description = ""
authors = [
    { name = "Nick van der Burgt", email = "nick.van.der.burgt@elaad.nl" },
    { name = "Stijn van Houwelingen", email = "stijn.van.houwelingen@elaad.nl" }
]
requires-python = ">=3.13,<4.0"
readme = "README.md"
license = "Apache-2.0 AND CC-BY 4.0 AND CC0-1.0"
classifiers = ["Private :: Do not Upload"]
dependencies = [
    "django (>=5.2.5,<6.0.0)",
    "django-widget-tweaks (>=1.5.0,<2.0.0)",
    "django-cotton (>=2.1.3,<3.0.0)",
    "django-htmx (>=1.23.2,<2.0.0)",
    "django-compressor (>=4.5.1,<5.0.0)",
    "django-browser-reload (>=1.18.0,<2.0.0)",
    "django-template-partials (>=25.1,<26.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "django-stubs-ext (>=5.2.2,<6.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "pycountry (>=24.6.1,<25.0.0)",
    "django-compression-middleware (>=0.5.0,<0.6.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "openadr3-client (>=1.0.0,<2.0.0)",
    "mozilla-django-oidc (>=5.0.2,<6.0.0)",
    "psycopg[c]",
    "whitenoise[brotli] (>=6.9.0,<7.0.0)",
    "chardet (>=5.2.0,<6.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "django-view-breadcrumbs (>=2.5.1,<3.0.0)",
    "huey (>=2.5.4,<3.0.0)",
    "django-lockmgr (>=2.0.0,<3.0.0)",
    "huey-django-orm (>=24.10.24.0,<25.0.0.0)",
    "urllib3[brotli]>=2.6.3",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2,<1.19.0",
    "django-stubs>=5.1.3,<6",
    "ruff>=0.13.2,<0.14",
    "bandit>=1.8.3,<2",
    "djlint>=1.36.4,<2",
    "taskipy>=1.14.1,<2",
    "wemake-python-styleguide>=1.0.0,<2",
    "pytest>=8.3.5,<9",
    "pytest-django>=4.11.1,<5",
    "pytest-env>=1.2.0",
    "reuse>=6.2.0",
    "pre-commit>=4.5.1",
    "types-pytz>=2025.2.0.20251108",
    "types-requests>=2.32.4.20260107",
    "pandas-stubs>=2.3.3.260113",
    "pytest-cov>=7.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.taskipy.tasks]
local-ci = "task check && task format && task mypy && task bandit && task test && task reuse && task djlint"
fix = "task check-fix && task format-fix && task mypy && task bandit"
check = "ruff check ."
check-fix = "ruff check --fix ."
check-ci = "ruff check --output-format=github --no-cache ."
mypy = "mypy . --check-untyped-defs"
djlint = "djlint ."
format = "ruff format . --diff"
format-fix = "ruff format ."
format-ci = "ruff format --diff --no-cache ."
bandit = "bandit -c pyproject.toml -r ."
dev = "python openadrgui/manage.py runserver"
# Will only add headers to files that are not already licensed.
# Cannot ignore uv.lock through REUSE.toml, see https://codeberg.org/fsfe/reuse-tool/pulls/1303
reuse-fix = """
reuse annotate \
  --license Apache-2.0 \
  --copyright "Contributors to openadr3-client <https://github.com/ElaadNL/openadr3-client>" \
  --exclude-year \
  --recursive \
  --skip-unrecognised \
  --skip-existing \
  .
"""
reuse = "reuse lint"
test = "pytest --cov --doctest-modules openadrgui/openadrgui/ openadrgui/tests/"

[tool.pytest.ini_options]
# Use a timezone other than UTC, to test timezone transitions and DST.
env = [
    "TZ=Europe/Helsinki",
]
DJANGO_SETTINGS_MODULE = "openadrgui.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["openadrgui/tests"]
pythonpath = ["openadrgui"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = [
    "--import-mode=importlib",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
mypy_path = ["openadrgui"]

strict = true
ignore_missing_imports = false
show_error_codes = true
disallow_untyped_defs = true
check_untyped_defs = true

exclude = [
  "mypy-*.migrations.*",
  "openleadr-vtn-devserver/.*",
]

# Explicitly ignore missing imports, so we don't forget to import them for libraries with type stubs.
[[tool.mypy.overrides]]
module = ["mozilla_django_oidc.*", "lockmgr.*", "huey.*", "environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  # Django ORM models are automatically generated, so we need to ignore the type errors.
  "openadrgui.models.djangomodels",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disable_error_code = [
  "metaclass",
  "type-arg",
  "no-any-return",
  "return-value",
  "misc",
]

[tool.django-stubs]
django_settings_module = "openadrgui.settings"

[tool.djlint]
profile="django"
custom_html="c-\\w+"
exclude="node_modules, .ruff_cache, .mypy_cache, __pycache__"
format_css=true
format_js=true
use_gitignore=true

[tool.ruff]
line-length = 120
exclude = ["openadrgui/openadrgui/migrations", "openleadr-vtn-devserver"]

[tool.ruff.lint]
select = ["ALL"]

preview = true
explicit-preview-rules = true
extend-select = ["UP042"]

# Do not require docstrings for functions, methods and classes
ignore = [
    # From:https://github.com/wemake-services/wemake-django-template/blob/master/pyproject.toml
    "A005",   # allow to shadow stdlib and builtin module names
    "COM812", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "D100",
    "D104",
    "D106",
    "D203",
    "D212",
    "D401",
    "D404",
    "D405",
    "ISC001",  # implicit string concat conflicts with `ruff format`
    "ISC003",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    # "PLR2004", # do not report magic numbers -> I do want to report magic numbers
    "PLR6301", # do not require classmethod / staticmethod when self not used
    "TRY003",  # long exception messages from `tryceratops`
    # Start of own error codes
    "ANN002", # Ignore unused *args
    "ANN003", # Ignore unused **kwargs
    "D107", # Allow undocumented __init__
]

external = [ "WPS" ]

[tool.ruff.lint.per-file-ignores]
"openadrgui/tests/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
