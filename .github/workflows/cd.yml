name: Deploy GUI

env:
  REGISTRY: docker.elaad.io
  IMAGE_NAME: ${{ github.repository }}

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_tag_push_to_ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4

      - name: Create version tag
        shell: bash
        run: echo "tag=docker.elaad.io/elaadnl/openadr3-gui:$(git show -s --format="%ct-%h" $GITHUB_SHA)" >> $GITHUB_ENV
      - name: Latest tag on main branch
        if: github.ref == 'refs/heads/main'
        run: echo "tag_main=,docker.elaad.io/elaadnl/openadr3-gui:latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3 # v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: "${{ env.tag }}${{ env.tag_main }}"
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # A deploy job which will publish the latest version of the docker image to an Azure Server will be handled in a future PR.
