{% load widget_tweaks %}
{# Must always be in a c-modal component. #}
<form method="post"
enctype="multipart/form-data"
hx-post="{{ url }}"
hx-disabled-elt="find button[type='submit']"
novalidate>
    <div>
        <div class="flex flex-col gap-4">
            {% for field in import_csv_form %}
                <c-form-field :field=field />
            {% endfor %}
        </div>
    </div>
    <c-form-errors :form=import_csv_form />
    <div class="flex justify-end mt-6 flex gap-2">
        <button type="button" @click.prevent="$el.closest('dialog').close()" class="btn btn-ghost">Back</button>
        <button type="submit" class="btn btn-primary">
            <span>Submit file</span>
            <i id="file-indicator" class="bi bi-arrow-repeat animate-spin htmx-indicator"></i>
        </button>
    </div>
</form>
