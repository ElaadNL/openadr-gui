{% if form.non_field_errors %}
    <div class="py-4">
        <p>Please correct the errors below:</p>
        <ul class="list-disc text-error pl-4">
            {% for error in form.non_field_errors %}
                <li>{{ error|linebreaksbr }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
